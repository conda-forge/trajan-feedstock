{% set name = "trajan" %}
{% set version = "0.10.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 50e7701ab03c742f810d7a6b9799cf7e8dfa29074937f535b51813b2ec8d77c2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - trajanshow = trajan.scripts.trajanshow:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry >=1
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy >=1.23
    - scipy >=1.9
    - xarray >=2022.6.0
    - pandas >=2
    - matplotlib-base >=3.5
    - cartopy >=0.21
    - pyproj >=2.3
    - click >=8
    - cf_xarray >=0.8
    - netcdf4 >=1.6
    - bottleneck >=1.3
    - roaring-landmask >=0.7

test:
  imports:
    - trajan
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - trajanshow --help

about:
  home: https://github.com/OpenDrift/trajan
  summary: Trajectory analysis package for simulated and observed trajectories
  description: Trajectory analysis package for simulated and observed trajectories
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE
  doc_url: https://opendrift.github.io/trajan/
  dev_url: https://github.com/OpenDrift/trajan

extra:
  recipe-maintainers:
    - gauteh
    - knutfrode
